<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4ff40">
  <meta name="description" content="Trois jeux de gestes dans l’univers de Paillettes & Pavés : marionnette élastique, micro-fronde et plateau à bascule.">
  <title>Ça va déborder — Paillettes & Pavés</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js"></script>
</head>
<body>
 <main class="app">
  <header class="topbar"><a href="./" aria-label="Accueil du jeu Paillettes et Pavés"><img src="./assets/logo.webp" alt="Paillettes & Pavés" width="170" height="56"></a><div class="tools"><button id="sound" aria-pressed="true" aria-label="Couper le son">SON ON</button><button id="pause" disabled aria-label="Mettre en pause">Ⅱ</button></div></header>
  <section id="home" class="home">
   <div class="home-art"><div class="halftone"></div><p class="sticker">3 JEUX · 1 POUCE</p><div class="home-cast" role="img" aria-label="Marcel et Zaza en pixel art"><span class="pixel-marcel"></span><span class="pixel-zaza"></span></div><h1>ÇA VA<br><em>DÉBORDER.</em></h1><span class="spark" aria-hidden="true">✳</span></div>
   <div class="home-bottom"><p class="pitch">Tire les ficelles. Fais tourner le micro.<br>Renverse le plateau.</p><button id="tour" class="primary">JOUER LES 3 NUMÉROS <span>↗</span></button><div class="picks" aria-label="Essayer un numéro"><button data-mode="0"><b>01</b><span>RETOUR<br>DE BÂTON</span></button><button data-mode="1"><b>02</b><span>MICRO<br>FRONDE</span></button><button data-mode="2"><b>03</b><span>PAVÉ<br>PENDULE</span></button></div><p class="record">RECORD <b id="best">0</b><span>75 secondes · mode portrait</span></p></div>
  </section>
  <section id="play" class="play" hidden aria-label="Partie arcade">
   <div class="hud"><div><span id="round">01 / 03</span><strong id="name">RETOUR DE BÂTON</strong></div><div class="points"><strong id="score">0</strong><span>POINTS</span></div><div class="time"><strong id="time">25</strong><span>SEC.</span></div></div>
   <div class="progress"><div id="progress"></div></div>
   <div class="stage"><canvas id="game" width="320" height="400" aria-label="Scène du jeu. Les commandes sont sous la scène."></canvas><div id="feedback" aria-live="polite"></div>
    <div id="panel" class="panel" hidden><p id="eyebrow">NUMÉRO 01</p><h2 id="heading">RETOUR<br>DE BÂTON</h2><div id="gesture" aria-hidden="true">↔</div><p id="explanation"></p><p id="detail"></p><button id="action" class="primary">C’EST PARTI ↗</button><button id="menu" class="text-button">RETOUR AUX 3 JEUX</button></div>
   </div>
   <div class="thumb-zone"><div class="pad-caption"><span id="pad-label">TIRE LES FICELLES</span><b id="combo">×1</b></div><div id="pad" class="pad" role="slider" tabindex="0" aria-label="Commande tactile du jeu. Flèches pour déplacer, espace pour tenir puis relâcher le micro." aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="pad-cross" aria-hidden="true"></span><span id="thumb" aria-hidden="true">✳</span><span id="pad-hint" aria-hidden="true">POSE TON POUCE ICI</span></div></div>
  </section>
  <div id="loading" class="loading" role="status">Préparation du castelet…</div><div id="status" class="sr-only" aria-live="polite"></div>
 </main>
</body>
</html>
